name: Release v0.1.20

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.1.20
  cancel-in-progress: false

env:
  TAG: v0.1.20

jobs:
  verify:
    name: Verify release state and source
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release state and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release must be run from main, but got ${GITHUB_REF}."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 1
          fi

          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v${package_version}" != "${TAG}" ]; then
            echo "Cargo.toml version v${package_version} does not match ${TAG}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            test_command: ./dist/logcut
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            test_command: qemu-aarch64 -L /usr/aarch64-linux-gnu ./dist/logcut

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ARM64 build and test tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Configure cross linker
        if: matrix.linker
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          target_env="$(printf '%s' "${TARGET}" | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${target_env}_LINKER=${LINKER}" >> "${GITHUB_ENV}"

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"

      - name: Package and verify artifact
        env:
          TARGET: ${{ matrix.target }}
          TEST_COMMAND: ${{ matrix.test_command }}
        run: |
          set -euo pipefail

          archive="logcut-${TAG}-${TARGET}.tar.gz"
          mkdir -p dist artifact
          install -m 0755 "target/${TARGET}/release/logcut" dist/logcut

          ${TEST_COMMAND} --version
          ${TEST_COMMAND} --help > /dev/null
          ${TEST_COMMAND} true

          tar -C dist -czf "artifact/${archive}" logcut
          tar -tzf "artifact/${archive}" | grep -qx 'logcut'
          sha256sum "artifact/${archive}"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: artifact/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Linux release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          set -euo pipefail

          expected_archives=(
            "logcut-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "logcut-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
          )

          for archive in "${expected_archives[@]}"; do
            test -f "dist/${archive}"
            tar -tzf "dist/${archive}" | grep -qx 'logcut'
          done

          (
            cd dist
            sha256sum "${expected_archives[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/logcut-${{ env.TAG }}-x86_64-unknown-linux-gnu.tar.gz
            dist/logcut-${{ env.TAG }}-aarch64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "logcut ${TAG}" \
            --notes-file .github/release-notes/v0.1.20.md
